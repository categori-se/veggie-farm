name: Deploy community
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts
      - run: npm run verify:community
      - name: Write explicit destination outside source
        env:
          DEPLOY_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          DEPLOY_BUCKET: ${{ vars.COMMUNITY_BUCKET }}
          DEPLOY_DISTRIBUTION: ${{ vars.COMMUNITY_DISTRIBUTION_ID }}
          DEPLOY_ORIGIN: ${{ vars.COMMUNITY_ORIGIN_ID }}
          DEPLOY_REGION: ${{ vars.AWS_REGION }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          keys = {'accountId':'DEPLOY_ACCOUNT','bucket':'DEPLOY_BUCKET','distributionId':'DEPLOY_DISTRIBUTION','originId':'DEPLOY_ORIGIN','region':'DEPLOY_REGION'}
          target=Path(os.environ['RUNNER_TEMP'])/'community-destination.json'
          values={key:os.environ[value] for key,value in keys.items()}
          for value in values.values():
              if value: print('::add-mask::'+value)
          target.write_text(json.dumps(values))
          target.chmod(0o600)
          PY
      - run: node scripts/deploy-community.mjs --plan --config "$RUNNER_TEMP/community-destination.json" --output "$RUNNER_TEMP/community-plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: community-plan
          path: ${{ runner.temp }}/community-plan.json
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: community-production
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: community-plan
          path: ${{ runner.temp }}
      - name: Write explicit destination outside source
        env:
          DEPLOY_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          DEPLOY_BUCKET: ${{ vars.COMMUNITY_BUCKET }}
          DEPLOY_DISTRIBUTION: ${{ vars.COMMUNITY_DISTRIBUTION_ID }}
          DEPLOY_ORIGIN: ${{ vars.COMMUNITY_ORIGIN_ID }}
          DEPLOY_REGION: ${{ vars.AWS_REGION }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          keys = {'accountId':'DEPLOY_ACCOUNT','bucket':'DEPLOY_BUCKET','distributionId':'DEPLOY_DISTRIBUTION','originId':'DEPLOY_ORIGIN','region':'DEPLOY_REGION'}
          target=Path(os.environ['RUNNER_TEMP'])/'community-destination.json'
          values={key:os.environ[value] for key,value in keys.items()}
          for value in values.values():
              if value: print('::add-mask::'+value)
          target.write_text(json.dumps(values))
          target.chmod(0o600)
          PY
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.COMMUNITY_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: community-release
          mask-aws-account-id: true
      - run: node scripts/deploy-community.mjs --apply --config "$RUNNER_TEMP/community-destination.json" --plan-file "$RUNNER_TEMP/community-plan.json"
