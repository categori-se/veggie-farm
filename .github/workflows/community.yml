name: Community checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: community-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts
      - run: npm run build:dependency-notices
      - run: npm run check:dependency-notices
      - run: npm run check:public-git
      - run: npm run check:public
      - run: npm test
      - run: npm run test:notices
      - run: npm run validate:data
      - run: npm run validate:plants
      - run: npm run validate:source-notices
      - run: npm run build
